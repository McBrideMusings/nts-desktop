name: CI/CD

on:
  pull_request: {}
  push:
    branches:
      - main
    tags:
      - v*.*.*

jobs:
  build:
    name: Build native app
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" mac/Info.plist

      - name: Import signing certificate
        id: cert
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity found in imported cert" >&2
            exit 1
          fi
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build .dmg (notarized)
        if: steps.cert.outputs.identity != ''
        env:
          CODE_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: |
          echo "${{ secrets.ASC_API_KEY_P8 }}" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          export APP_STORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          make -C mac notarize

      - name: Build .dmg (ad-hoc, unsigned)
        if: steps.cert.outputs.identity == ''
        run: make -C mac dmg

      - name: Rename artifact
        run: mv "mac/build/NTS Radio.dmg" "mac/build/NTS-Radio.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nts-radio-dmg
          path: mac/build/NTS-Radio.dmg

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nts-radio-dmg
          path: dist

      - name: Compute version and sha256
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: sha
        run: echo "sha256=$(shasum -a 256 dist/NTS-Radio.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/NTS-Radio.dmg
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}

  homebrew:
    name: Update Homebrew tap
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: McBrideMusings/homebrew-nts
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump cask
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          SHA256="${{ needs.release.outputs.sha256 }}"
          sed -i "s/version \".*\"/version \"$VERSION\"/" tap/Casks/nts-radio.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA256\"/" tap/Casks/nts-radio.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "pierce"
          git config user.email "3522175+McBrideMusings@users.noreply.github.com"
          git add Casks/nts-radio.rb
          git commit -m "nts-radio ${{ needs.release.outputs.version }}"
          git push
